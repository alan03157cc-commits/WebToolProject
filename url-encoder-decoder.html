<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL 編碼與解碼</title><style>:root{color-scheme:dark;--bg:#071326;--card:#101f38;--line:#294365;--text:#f0f7ff;--muted:#9eb2cb;--accent:#60a5fa;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#061020,#123359);font-family:system-ui,"Noto Sans TC",sans-serif;color:var(--text)}main{width:min(880px,100%);padding:clamp(22px,5vw,40px);background:#101f38ee;border:1px solid var(--line);border-radius:24px}h1{margin:0 0 8px}p{margin:0 0 22px;color:var(--muted)}.mode{display:flex;gap:10px;margin-bottom:14px}.mode label{padding:9px 12px;background:#172c4b;border-radius:10px}textarea{width:100%;height:170px;resize:vertical;background:#071326;border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--text);font:15px/1.5 ui-monospace,monospace;outline:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}button{border:0;border-radius:11px;padding:12px 16px;background:#203b60;color:var(--text);font:inherit;font-weight:750;cursor:pointer}button.primary{background:var(--accent);color:#071a32}.result{margin-top:16px}.result label{display:block;font-weight:700;margin-bottom:8px}.status{min-height:22px;color:var(--muted);margin-top:10px}.bad{color:var(--bad)}</style></head><body><main><h1>URL 編碼／解碼</h1><p>安全處理網址中的中文、空白與特殊字元。</p><div class="mode"><label><input type="radio" name="mode" value="component" checked> 網址參數</label><label><input type="radio" name="mode" value="full"> 完整網址</label></div><textarea id="input" placeholder="輸入網址或文字"></textarea><div class="actions"><button class="primary" id="encode">編碼</button><button id="decode">解碼</button><button id="swap">結果移到輸入</button><button id="copy">複製結果</button><button id="clear">清除</button></div><div class="result"><label for="output">結果</label><textarea id="output" readonly></textarea></div><div id="status" class="status"></div></main><script>
const mode=()=>document.querySelector('input[name=mode]:checked').value;function run(type){try{const fn=type==='encode'?(mode()==='full'?encodeURI:encodeURIComponent):(mode()==='full'?decodeURI:decodeURIComponent);output.value=fn(input.value);status.className='status';status.textContent=type==='encode'?'編碼完成':'解碼完成'}catch(e){status.className='status bad';status.textContent='內容格式無法解碼：'+e.message}}encode.onclick=()=>run('encode');decode.onclick=()=>run('decode');swap.onclick=()=>{input.value=output.value;output.value='';input.focus()};copy.onclick=async()=>{if(output.value){await navigator.clipboard.writeText(output.value);status.textContent='已複製'}};clear.onclick=()=>{input.value=output.value='';status.textContent=''};
</script>
